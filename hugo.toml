baseURL = '/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = 'nno的博客'
theme = 'hugo-theme-stack'
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
mainSections = ['posts']
rssFullContent = true
SortBy = 'default'

[params.footer]
since = 2026
customText = ''

[params.dateFormat]
published = '2006-01-02'
lastUpdated = '2006-01-02'

[params.sidebar]
emoji = ''
subtitle = '🎇 会吃饭会睡觉~'
avatar = 'img/avatar-nno.png'

[params.article]
headingAnchor = true
math = false
toc = true
readingTime = true

[params.article.license]
enabled = false

[params.widgets]
homepage = [
    { type = 'search' },
    { type = 'archives', params = { limit = 8 } },
    { type = 'tag-cloud', params = { limit = 10 } },
]
page = []

[params.colorScheme]
toggle = false
default = 'dark'

[params.comments]
enabled = false

[[menu.main]]
identifier = 'home'
name = '首页'
url = '/'
weight = -100

[menu.main.params]
icon = 'home'

[[menu.main]]
identifier = 'archives'
name = '归档'
url = '/archives/'
weight = -90

[menu.main.params]
icon = 'archives'

[[menu.main]]
identifier = 'tags'
name = '标签'
url = '/tags/'
weight = -80

[menu.main.params]
icon = 'tag'

[[menu.main]]
identifier = 'search'
name = '搜索'
url = '/search/'
weight = -70

[menu.main.params]
icon = 'search'
